<script>window._ROUTER_DATA = {"loaderData": {"(lang)/docs/(libcode)/(doccode$)/page": {"curDoc": {"MDContent": "<span id=\"e2kfofV6\"></span>\n# Preparation\n\n<span id=\"JleeXaKu\"></span>\n## API signature\n\n\n| |**Description** |**Notes** |\n|---|---|---|\n|Tenant AK/SK<br><br> |Mapped to the BytePlus tenant ID and used to call OpenAPI endpoints.<br><br>&nbsp;<br><br>How to view:<br><br><br>* Log in to the BytePlus website<br><br>* Click your profile avatar in the upper\\-right corner and go to \"API access key\"<br><br><br>&nbsp;<br><br>If you are using a sub\\-account, API permission authorization is required:<br><br><br>* Click your profile avatar in the upper\\-right corner and go to \"IAM\"<br><br>* In the left navigation, go to \"IAM \\>\\> USER\", find the target sub\\-account, and open the Permissions tab<br><br>* Search for and add MktInsightFullAccess |Follow the BytePlus OpenAPI specification. API call guides:<br><br>[Overview of BytePlus OpenAPI](https://docs.byteplus.com/en/docs/byteplus-platform/reference-overview-1)<br><br>[How To Calculate A Signature](https://docs.byteplus.com/en/docs/byteplus-platform/reference-how-to-calculate-a-signature)<br><br> |\n\n\n&nbsp;\n\n<span id=\"4RUf7gG4\"></span>\n# API list\n\nAPI calls\n\n\n1. Domain: mkt\\-insight.byteplusapi.com\n\n2. All listed APIs are standard BytePlus APIs. Requests must follow [How To Calculate A Signature](https://docs.byteplus.com/en/docs/byteplus-platform/reference-how-to-calculate-a-signature) for request signing\n\n3. This document lists only endpoint\\-specific request parameters and some common parameters. For more information, see [Common parameters](https://docs.byteplus.com/en/docs/byteplus-platform/reference-common-parameters) and [Common error codes](https://docs.byteplus.com/en/docs/byteplus-platform/reference-common-error-codes)\n\n\n<span id=\"xsn6xxMU\"></span>\n## 1 PullPosts\n\n\n1. Retrieve all posts under the target task within the specified date range\n\n2. Each request returns up to 100 records and includes a PageToken for pagination, which must be passed in the next request\n\n3. StartTime cannot be earlier than 90 days ago\n\n\n<span id=\"sDliBPVQ\"></span>\n### Header\n\n\n|**Parameter** |**Type** |**Required** |**Example** |**Description** |\n|---|---|---|---|---|\n|Content\\-Type |String |Yes |'application/json' | |\n|ServiceName |String |Yes | |mkt_insight |\n|Region |String |Yes | |ap\\-southeast\\-1 |\n\n\n<span id=\"nmstvLRa\"></span>\n### Query\n\n\n|**Parameter** |**Type** |**Required** |**Example** |**Description** |\n|---|---|---|---|---|\n|Action |String |Yes |PullPosts |API name |\n|Version |String |Yes |2026\\-03\\-24 |API version |\n\n\n<span id=\"zCYNlv9O\"></span>\n### Body\n\n\n|**Parameter** |**Type** |**Required** |**Example** |**Description** |\n|---|---|---|---|---|\n|TaskID |int |Yes |102 |Target task ID |\n|StartTime |string |Yes |\"2026\\-05\\-21 00:00:00\" |Start time, cannot be earlier than 90 days ago |\n|EndTime |string |Yes |\"2026\\-05\\-31 02:00:00\" |End time |\n|PageToken |string |Yes | |Pagination token |\n|Size |int |No | |Default 20, maximum 100 |\n\n\n<span id=\"kO1ii5qf\"></span>\n### Response parameters\n\n<span id=\"akf0Opyi\"></span>\n#### ResultStruct\n\n\n|**Parameter** |**Type** |**Required** |**Example** |**Description** |\n|---|---|---|---|---|\n|HasMore |bool |Yes |'true' |Whether there are more records |\n|NextPageToken |string |Yes |WzE3Nzk4Njc0MTYwMDBd |Pagination parameter for next request |\n|ItemDocs |Array<PostStruct\\> |Yes | |List of posts |\n\n\n<span id=\"zz3Nc9QV\"></span>\n#### PostStruct\n\n\n|**Parameter** |**Type** |**Required** |**Example** |**Description** |\n|---|---|---|---|---|\n|PostID |string |Yes |8112285228863105011 |Post ID |\n|Title |string |No | |Title |\n|Content |string |No | |Content |\n|Url |string |Yes | |Original post URL |\n|PublishTime |string |Yes |'2026\\-05\\-27 07:42:49' |Publish time |\n|Summary |string |No | |Summary |\n|Ocr |string |No | |OCR |\n|Emotion |string |No | |Sentiment tag |\n|Reason |string |No | |Relevance reason |\n|RiskType |Array<string\\> |No | |Content tag |\n\n\n<span id=\"FAFsPzyq\"></span>\n"}}}}</script>
