# Editorial prose migrated from the published Similarweb reference.
# Parameter constraints, dated examples and billing calculations remain runtime-owned.
get_similarweb_ad_networks:
  description: Ad Networks. Response follows the SimilarWeb v5 envelope (meta + data).
get_similarweb_audience_interest:
  description: Audience Interest. Response follows the SimilarWeb v5 envelope (meta + data).
get_similarweb_audience_overlap:
  description: 'Audience Overlap. Response follows the SimilarWeb v5 envelope (meta + data). Note: `data`
    may arrive grouped as an array of arrays.'
get_similarweb_deduplicated_audience:
  description: Deduplicated Audience. Response follows the SimilarWeb v5 envelope (meta + data).
get_similarweb_demographics:
  description: Demographics. Response follows the SimilarWeb v5 envelope (meta + data).
get_similarweb_keyword_competitors:
  description: Keyword Competitors. Response follows the SimilarWeb v5 envelope (meta + data).
get_similarweb_keywords:
  description: 'Website Keywords. Response follows the SimilarWeb v5 envelope (meta + data). Note: `data`
    may arrive grouped as an array of arrays.'
get_similarweb_landing_pages:
  description: Landing Pages. Response follows the SimilarWeb v5 envelope (meta + data).
get_similarweb_marketing_channel_sources_legacy:
  description: Marketing Channel Sources. Response follows the SimilarWeb v5 envelope (meta + data).
get_similarweb_popular_pages:
  description: 'Popular Pages. Response follows the SimilarWeb v5 envelope (meta + data). Note: `data`
    may arrive grouped as an array of arrays.'
get_similarweb_ppc_spend:
  description: PPC Spend. Response follows the SimilarWeb v5 envelope (meta + data).
get_similarweb_ranking:
  description: Website Ranking. Response follows the SimilarWeb v5 envelope (meta + data).
get_similarweb_referrals:
  description: Referrals. Response follows the SimilarWeb v5 envelope (meta + data).
get_similarweb_serp_players_aggregated:
  description: SERP Players - Aggregated. Response follows the SimilarWeb v5 envelope (meta + data).
get_similarweb_serp_players_timeseries:
  description: SERP Players - Clicks over time. Response follows the SimilarWeb v5 envelope (meta + data).
get_similarweb_similar_sites:
  description: Returns sites with similar audiences. Responses follow the SimilarWeb v5 envelope (meta
    + data).
  x-aisa-notes:
  - Upstream requires exactly three consecutive months within its most recent supported window. The window
    advances as SimilarWeb publishes new data; older windows can be rejected with upstream error 101.
    The Provider describe API reports the currently supported range.
get_similarweb_subdomains:
  description: Website Subdomains. Response follows the SimilarWeb v5 envelope (meta + data).
get_similarweb_technologies:
  description: Returns website technology information. Responses follow the SimilarWeb v5 envelope (meta
    + data).
  x-aisa-notes:
  - The requested month must be the latest month available from SimilarWeb. Availability can differ by
    country. Error 101 reports the currently allowed date range.
get_similarweb_top_sites_ranking:
  description: Top Sites Ranking. Response follows the SimilarWeb v5 envelope (meta + data).
get_similarweb_traffic_engagement:
  description: Traffic & Engagement. Response follows the SimilarWeb v5 envelope (meta + data).
get_similarweb_website_top_geographies:
  description: Returns the leading countries by share of a domain's traffic for the latest available month.
    Geography coverage is worldwide.
get_similarweb_website_traffic_snapshot:
  description: 'Latest-month traffic snapshot for a domain: visits plus core engagement metrics (average
    visit duration, bounce rate, pages per visit) in a single object. The most recent available month
    is selected automatically and echoed in meta.start_date / meta.end_date.'
get_similarweb_website_traffic_trend:
  description: Monthly traffic time series for a domain over the recent available window (data.points,
    one entry per month). The window is selected automatically and echoed in meta.start_date / meta.end_date.
