name: Pull runtime API contracts

on:
  schedule:
    - cron: '*/30 * * * *'
  repository_dispatch:
    types: [contract-updated]
  workflow_dispatch:
    inputs:
      publish:
        description: Commit verified generated contracts (default is dry run)
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - 'openapi/registry.yaml'
      - 'openapi/overlays/**'
      - 'openapi/upstream/**'
      - 'scripts/compose_openapi.py'
      - 'scripts/pull_openapi.py'

permissions:
  contents: write

concurrency:
  group: pull-openapi
  cancel-in-progress: false

jobs:
  compose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install 'PyYAML>=6,<7'
      - name: Test composition and preservation rules
        run: python -m unittest discover -s scripts/tests -v
      - name: Restore public runtime response cache
        uses: actions/cache@v4
        with:
          path: .cache/runtime-contracts
          key: runtime-contracts-${{ github.run_id }}
          restore-keys: runtime-contracts-
      - name: Stage contracts
        id: pull
        continue-on-error: true
        run: python scripts/pull_openapi.py --write
      - name: Runtime unavailable or contract gate failed
        if: steps.pull.outcome != 'success'
        run: echo 'Runtime contracts were unavailable or failed validation. Published files were preserved.' >> "$GITHUB_STEP_SUMMARY"
      - name: Consolidate generated contracts
        if: steps.pull.outcome == 'success'
        run: python scripts/consolidate_openapi.py --output openapi.yaml
      - name: Validate page references
        if: steps.pull.outcome == 'success'
        run: python scripts/validate_api_reference_slugs.py
      - name: Review staged differences
        if: steps.pull.outcome == 'success'
        run: git diff --stat >> "$GITHUB_STEP_SUMMARY"
      - name: Commit verified contracts
        if: steps.pull.outcome == 'success' && (inputs.publish == true || (github.event_name != 'workflow_dispatch' && vars.RUNTIME_CONTRACT_PUBLISH == 'true'))
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add openapi api-reference zh/api-reference docs.json openapi.yaml
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'chore: regenerate runtime API contract mirrors'
          git pull --rebase origin main
          git push origin HEAD:main
