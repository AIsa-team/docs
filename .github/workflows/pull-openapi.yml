name: Pull runtime API contracts

on:
  # Dormant until BOTH the tracked plan and operator variable are enabled.
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
    inputs:
      publish:
        description: Commit verified generated contracts (default is dry run)
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: pull-openapi
  cancel-in-progress: false

jobs:
  activation-plan:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      enabled: ${{ steps.plan.outputs.enabled }}
    steps:
      - uses: actions/checkout@v4
      - id: plan
        run: |
          python scripts/contract_activation.py > /tmp/activation-plan.json
          echo "enabled=$(python -c 'import json; print(str(json.load(open("/tmp/activation-plan.json"))["activation_enabled"]).lower())')" >> "$GITHUB_OUTPUT"
  compose:
    needs: activation-plan
    if: github.event_name == 'workflow_dispatch' || (needs.activation-plan.outputs.enabled == 'true' && vars.RUNTIME_CONTRACT_ACTIVATION_ENABLED == 'true')
    runs-on: ubuntu-latest
    # Runner headroom for the complete strict graph checks; acceptance remains 1h/4h.
    timeout-minutes: 20
    outputs:
      docs_commit: ${{ steps.publish.outputs.docs_commit }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install 'PyYAML>=6,<7' 'jsonschema>=4.23,<5' 'openapi-spec-validator>=0.7,<0.8'
      - name: Test composition and preservation rules
        run: python -m unittest discover -s scripts/tests -v
      - name: Acquire one complete fresh immutable Runtime release
        run: python scripts/fetch_runtime_release.py --current --output /tmp/formal-runtime-facts
      - name: Restore attributed source maintenance evidence
        uses: actions/cache/restore@v4
        with:
          path: .cache/source-reviews.json
          key: source-reviews-publish-${{ github.run_id }}
          restore-keys: source-reviews-
      - name: Combine reviewed source evidence with newer observations
        run: >-
          python scripts/prepare_source_receipts.py
          --reviewed docs/current-source-review-20261009/merged-source-reviews.json
          --cache .cache/source-reviews.json
      - name: Stage contracts
        id: pull
        env:
          REVIEWED_BASELINE: ${{ vars.RUNTIME_CONTRACT_BASELINE_REF }}
        run: |
          set +e
          python scripts/pull_openapi.py --write --facts-dir /tmp/formal-runtime-facts \
            --baseline-ref "$REVIEWED_BASELINE" \
            --readiness-report /tmp/contract-readiness.json
          status=$?
          set -e
          if [ "$status" -eq 2 ]; then
            echo 'available=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$status" -ne 0 ]; then exit "$status"; fi
          echo 'available=true' >> "$GITHUB_OUTPUT"
      - name: Preserve real source acquisition observations
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .cache/source-reviews.json
          key: source-reviews-pull-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Retain publication assessment
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: publication-contract-readiness
          path: /tmp/contract-readiness.json
          if-no-files-found: ignore
      - name: Runtime unavailable
        if: steps.pull.outputs.available == 'false'
        run: echo 'Runtime contracts were unavailable. Published files were preserved.' >> "$GITHUB_STEP_SUMMARY"
      - name: Consolidate generated contracts
        if: steps.pull.outputs.available == 'true'
        run: python scripts/runtime_consolidate_openapi.py --output openapi.yaml
      - name: Generate payment discovery from the same staged contracts
        if: steps.pull.outputs.available == 'true'
        run: |
          python scripts/refresh_payment_publication.py --facts-dir /tmp/formal-runtime-facts \
            --observation-report /tmp/payment-observation.json
          python scripts/generate_payment_discovery.py
      - name: Retain real payment observations without renewing unchanged publication
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: payment-observation
          path: /tmp/payment-observation.json
          if-no-files-found: ignore
      - name: Validate page references
        if: steps.pull.outputs.available == 'true'
        run: python scripts/validate_runtime_api_reference_slugs.py --generated-only
      - name: Check formal artifact readiness before publication
        if: steps.pull.outputs.available == 'true'
        env:
          REVIEWED_BASELINE: ${{ vars.RUNTIME_CONTRACT_BASELINE_REF }}
        run: |
          python scripts/check_contract_candidate.py --facts-dir /tmp/formal-runtime-facts \
            --baseline-ref "$REVIEWED_BASELINE" \
            --published-ref "$(git rev-parse HEAD)" \
            --report /tmp/formal-contract-readiness.json
      - name: Retain formal publication assessment
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: formal-contract-readiness
          path: /tmp/formal-contract-readiness.json
          if-no-files-found: ignore
      - name: Export the passed same-commit publication pointer
        if: steps.pull.outputs.available == 'true'
        run: >-
          python scripts/export_contract_publication.py
          --facts-dir /tmp/formal-runtime-facts
          --report /tmp/formal-contract-readiness.json
      - name: Review staged differences
        if: steps.pull.outputs.available == 'true'
        run: git diff --stat >> "$GITHUB_STEP_SUMMARY"
      - name: Commit contract mirrors and coverage
        id: prepare
        if: github.ref == 'refs/heads/main' && steps.pull.outputs.available == 'true' && (inputs.publish == true || (github.event_name != 'workflow_dispatch' && vars.RUNTIME_CONTRACT_PUBLISH != 'false'))
        env:
          PUBLISH_RUN_ID: ${{ github.run_id }}
          PUBLISH_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add openapi api-reference zh/api-reference docs.json llms.txt openapi.yaml docs/publication discovery/payment-evidence.json discovery/openapi.json
          if git diff --cached --quiet; then exit 0; fi
          # Export deliberately retains an equivalent authorized publication.
          # Non-graph observations alone cannot create a new consumer identity.
          if git diff --cached --quiet -- docs/publication/current.json docs/publication/formal-contract-readiness.json docs/publication/runtime-acquisition.json; then
            echo 'Formal publication unchanged; retaining original identity and budget.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          assessed_base=$(git rev-parse HEAD)
          python scripts/publication_origin.py record --run-id "$PUBLISH_RUN_ID" --attempt "$PUBLISH_RUN_ATTEMPT"
          git add docs/publication/release-origin.json
          git commit -m 'chore: regenerate runtime API contract mirrors'
          echo "candidate_commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "assessed_base=$assessed_base" >> "$GITHUB_OUTPUT"
      - name: Export and verify original schema inputs for the local formal commit
        if: steps.prepare.outputs.candidate_commit != ''
        env:
          CANDIDATE_COMMIT: ${{ steps.prepare.outputs.candidate_commit }}
          PUBLISH_RUN_ID: ${{ github.run_id }}
          PUBLISH_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: >-
          python scripts/schema_bundle_supply.py build
          --repo . --docs-ref "$CANDIDATE_COMMIT"
          --source-receipts .cache/source-reviews.json
          --run-id "$PUBLISH_RUN_ID" --run-attempt "$PUBLISH_RUN_ATTEMPT"
          --output "$RUNNER_TEMP/schema-bundle-supply"
      - name: Retain immutable schema input candidate before publication
        id: schema_bundle
        if: steps.prepare.outputs.candidate_commit != ''
        uses: actions/upload-artifact@v4
        with:
          name: schema-input-bundle-v2-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/schema-bundle-supply/
          if-no-files-found: error
          retention-days: 90
      - name: Push the assessed commit after schema supply succeeds
        id: publish
        if: steps.prepare.outputs.candidate_commit != ''
        env:
          CANDIDATE_COMMIT: ${{ steps.prepare.outputs.candidate_commit }}
          ASSESSED_BASE: ${{ steps.prepare.outputs.assessed_base }}
        run: |
          if [ "$(git rev-parse HEAD)" != "$CANDIDATE_COMMIT" ] || [ "$(git show -s --format=%P HEAD)" != "$ASSESSED_BASE" ]; then
            echo 'Local publication commit changed after schema export.' >&2
            exit 1
          fi
          # The formal receipt describes this exact graph. Never incorporate
          # concurrent main changes after assessment; retry from new inputs.
          git fetch origin main
          if [ "$(git rev-parse origin/main)" != "$ASSESSED_BASE" ]; then
            echo 'Main changed after contract assessment; publication must be retried.' >&2
            exit 1
          fi
          git push origin HEAD:main
          echo "docs_commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  notify-consumers:
    needs: compose
    if: needs.compose.outputs.docs_commit != ''
    uses: ./.github/workflows/dispatch-contract-consumers.yml
    with:
      docs_commit: ${{ needs.compose.outputs.docs_commit }}
    secrets: inherit
