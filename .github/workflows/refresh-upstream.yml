name: Review upstream contract changes
on:
  # Observe each automatic source before its maximum 24-hour acquisition age.
  # This maintenance schedule is independent of contract publication activation.
  schedule:
    - cron: '17 0,12 * * *'
  workflow_dispatch:

permissions:
  contents: read
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install 'PyYAML>=6,<7' 'jsonschema>=4.23,<5' 'openapi-spec-validator>=0.7,<0.8'
      - name: Restore source review receipts
        uses: actions/cache/restore@v4
        with:
          path: .cache/source-reviews.json
          key: source-reviews-${{ github.run_id }}
          restore-keys: source-reviews-
      - name: Combine reviewed source evidence with newer observations
        run: >-
          python scripts/prepare_source_receipts.py
          --reviewed docs/current-source-review-20261009/merged-source-reviews.json
          --cache .cache/source-reviews.json
      - name: Stage source updates and comparison evidence
        id: refresh
        continue-on-error: true
        run: python scripts/refresh_upstream.py --write --receipts .cache/source-reviews.json --report /tmp/upstream-report.json
      - name: Upload source comparison report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: upstream-contract-review
          path: /tmp/upstream-report.json
          if-no-files-found: error
      - name: Retain successful observations without refreshing failed reviews
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          report = Path('/tmp/upstream-report.json')
          if report.exists():
              data = json.loads(report.read_text())
              target = Path('.cache/source-reviews.json')
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_text(json.dumps({'schema_version': 1, 'receipts': data.get('receipts', {}), 'attempts': data.get('attempts', {})}, indent=2) + '\n')
          PY
      - name: Cache source receipt history
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .cache/source-reviews.json
          key: source-reviews-${{ github.run_id }}
      - name: Prepare review description
        run: |
          python - <<'PY'
          import json
          report = json.load(open('/tmp/upstream-report.json'))
          with open('/tmp/upstream-body.md', 'w') as body:
              body.write('Refresh official upstream schema mirrors. Runtime facts remain authoritative.\n\n')
              body.write('Removed operations remain historical evidence; compatibility is not assessed. No automatic merge.\n\n')
              body.write('The full field diff and source hashes/age are in the upstream-contract-review workflow artifact.\n\n')
              for provider, update in report['updated'].items():
                  comparison = update['semantic_changes']
                  counts = ', '.join(f"{len(comparison[key])} {key}" for key in ('added', 'removed', 'changed', 'uncertain'))
                  body.write(f"- {provider}: {comparison['status']} ({counts})\n")
              for provider, failure in report['failed'].items():
                  previous = failure['previous']
                  body.write(f"- {provider}: prior source preserved after {failure['failure']}; age seconds: {previous['source_age_seconds']}\n")
              for source, row in report.get('sources', {}).items():
                  if row['freshness'] != 'fresh':
                      body.write(f"- {source}: {row['status']} / {row['freshness']}; owner {row['owner']}; review due {row['review_due_at']}\n")
          PY
      - name: Detect source candidate changes
        id: source-changes
        run: |
          if git diff --quiet -- openapi/upstream; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          else
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Acquire fresh Runtime inputs for the review candidate
        if: steps.source-changes.outputs.changed == 'true'
        run: python scripts/fetch_runtime_release.py --current --output /tmp/source-review-runtime
      - name: Compose and assess the complete source review candidate
        if: steps.source-changes.outputs.changed == 'true'
        env:
          REVIEWED_BASELINE: ${{ vars.RUNTIME_CONTRACT_BASELINE_REF }}
        run: |
          python scripts/pull_openapi.py --write --facts-dir /tmp/source-review-runtime \
            --baseline-ref "$REVIEWED_BASELINE" --readiness-mode pr \
            --readiness-report /tmp/source-review-composition.json
          python scripts/runtime_consolidate_openapi.py --output openapi.yaml
          python scripts/validate_runtime_api_reference_slugs.py --generated-only
          python scripts/check_contract_candidate.py --facts-dir /tmp/source-review-runtime \
            --baseline-ref "$REVIEWED_BASELINE" --published-ref "$(git rev-parse HEAD)" \
            --report /tmp/source-review-readiness.json
          # This is a review candidate. Only pull-openapi exports formal receipts.
          git diff --exit-code -- docs/publication/current.json \
            docs/publication/formal-contract-readiness.json docs/publication/runtime-acquisition.json
      - name: Retain composed source candidate assessment
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: source-review-candidate-readiness
          path: |
            /tmp/source-review-composition.json
            /tmp/source-review-readiness.json
            /tmp/source-review-runtime/acquisition-receipt.json
          if-no-files-found: ignore
      - name: Generate scoped source review token
        id: review-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.TOOL_ROUTER_DISPATCH_APP_ID }}
          private-key: ${{ secrets.TOOL_ROUTER_DISPATCH_APP_PRIVATE_KEY }}
          owner: AIsa-team
          repositories: docs
          permission-contents: write
          permission-pull-requests: write
      - uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ steps.review-token.outputs.token }}
          branch: automation/upstream-contract-refresh
          title: 'chore: review upstream contract changes'
          commit-message: 'chore: refresh upstream contract mirrors for review'
          body-path: /tmp/upstream-body.md
          add-paths: |
            openapi
            api-reference
            zh/api-reference
            docs.json
            openapi.yaml
            docs/publication/sales-catalog.json
      - name: Report acquisition, policy or missing/overdue review failures
        if: steps.refresh.outcome == 'failure'
        run: exit 1
