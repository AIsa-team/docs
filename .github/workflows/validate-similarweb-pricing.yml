name: Validate SimilarWeb Pricing Docs

on:
  pull_request:
    paths:
      - ".github/workflows/validate-similarweb-pricing.yml"
      - ".github/workflows/sync-openapi.yml"
      - "docs.json"
      - "llms.txt"
      - "agent-quickstart.mdx"
      - "zh/agent-quickstart.mdx"
      - "openapi/**"
      - "api-reference/similarweb/**"
      - "zh/api-reference/similarweb/**"
      - "guides/pricing.mdx"
      - "guides/pricing/**"
      - "zh/guides/pricing.mdx"
      - "zh/guides/pricing/**"
      - "evaluate/pricing.mdx"
      - "zh/evaluate/pricing.mdx"
      - "scripts/check_similarweb_pricing.py"
      - "scripts/consolidate_openapi.py"
      - "scripts/generate_similarweb_pricing_docs.py"
      - "scripts/validate_similarweb_mintlify.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Check generated pricing surfaces
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout docs repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js for Mintlify validation
        uses: actions/setup-node@v4
        with:
          node-version: "20.17"

      - name: Install dependencies
        run: pip install pyyaml

      - name: Check checked-in pricing surfaces
        run: python scripts/generate_similarweb_pricing_docs.py --check

      - name: Consolidate OpenAPI source
        run: python scripts/consolidate_openapi.py --output /tmp/openapi.yaml

      - name: Check generated OpenAPI and discovery paths
        run: python scripts/check_similarweb_pricing.py --generated /tmp/openapi.yaml

      - name: Validate generated docs and OpenAPI with Mintlify
        run: python scripts/validate_similarweb_mintlify.py

      - name: Check patch whitespace
        run: git diff --check "origin/${{ github.base_ref }}...HEAD"
