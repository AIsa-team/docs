name: Generate dev Runtime docs

on:
  workflow_dispatch:
    inputs:
      force:
        description: Regenerate even when the verified Runtime inputs are unchanged
        type: boolean
        default: false
  push:
    branches: [dev]
    paths:
      - .github/workflows/generate-dev-docs.yml
      - scripts/**
      - openapi/registry.yaml
      - openapi/upstream/**
      # Translation memory feeds the generated Chinese pages and contracts.
      - translations/openapi-zh.json

permissions:
  contents: read

concurrency:
  group: generate-dev-runtime-docs
  cancel-in-progress: false

jobs:
  generate:
    if: github.repository == 'AIsa-team/docs' && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install generation dependencies
        run: pip install 'PyYAML>=6,<7' 'jsonschema>=4.23,<5' 'openapi-spec-validator>=0.7,<0.8'
      - name: Pull current dev Runtime contracts and generate a validated candidate
        env:
          FORCE_GENERATION: ${{ github.event_name == 'push' || inputs.force == true }}
        run: |
          options=()
          if [ "$FORCE_GENERATION" != true ]; then options+=(--if-changed); fi
          python scripts/sync_dev_runtime.py --write "${options[@]}" \
            --report "$RUNNER_TEMP/dev-runtime-report.json"
          git diff --check
      - name: Retain the acquisition and generation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dev-runtime-docs-report
          path: ${{ runner.temp }}/dev-runtime-report.json
          if-no-files-found: ignore
      - name: Commit and push validated documentation to dev
        run: |
          assessed_base=$(git rev-parse HEAD)
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add -- docs.json openapi.yaml openapi api-reference zh/api-reference docs/dev-runtime.json
          if git diff --cached --quiet; then
            echo 'Dev documentation is already up to date.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git diff --cached --check
          git commit -m 'docs(dev): refresh dev Runtime contracts'
          # Publish only the validated candidate. Retry next run if dev moved.
          git fetch origin dev
          if [ "$(git rev-parse origin/dev)" != "$assessed_base" ]; then
            echo 'Dev changed during generation; retry from the latest dev.' >&2
            exit 1
          fi
          git push origin HEAD:dev
          echo "Published dev documentation commit $(git rev-parse HEAD)." >> "$GITHUB_STEP_SUMMARY"
