name: Generate dev Runtime docs

# GitHub schedules run only from the default branch. This file is registered on
# main, but the checkout, Runtime origin, generated files and push target are dev.
on:
  schedule:
    - cron: '7,17,27,37,47,57 * * * *'
  push:
    branches: [main]
    paths: ['.github/workflows/generate-dev-docs.yml']
  workflow_dispatch:
    inputs:
      force:
        description: Regenerate even when the dev Runtime inputs have not changed
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: dev-docs-refs/heads/dev
  cancel-in-progress: false

jobs:
  generate:
    if: github.repository == 'AIsa-team/docs' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install generation dependencies
        run: pip install 'PyYAML>=6,<7' 'jsonschema>=4.23,<5' 'openapi-spec-validator>=0.7,<0.8'
      - name: Generate pages, contracts and navigation from dev Runtime changes
        env:
          FORCE_GENERATION: ${{ inputs.force || false }}
        run: |
          args=(--if-changed)
          if [[ "$FORCE_GENERATION" == true ]]; then args=(); fi
          python scripts/sync_dev_runtime.py --write "${args[@]}" --report /tmp/dev-runtime-report.json
      - name: Retain dev acquisition and generation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dev-runtime-report
          path: /tmp/dev-runtime-report.json
          if-no-files-found: ignore
      - name: Commit generated documentation only to dev
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = dev
          git diff --check
          git add -- docs.json openapi.yaml openapi '*.mdx' docs/dev-runtime.json
          if git diff --cached --quiet; then
            echo 'Dev Runtime inputs and generated documentation are unchanged.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'docs(dev): regenerate from dev Runtime changes'
          git push origin HEAD:refs/heads/dev
          echo 'Generated OpenAPI, English/Chinese endpoint pages and navigation on dev. Mintlify publishes docs/dev.' >> "$GITHUB_STEP_SUMMARY"
