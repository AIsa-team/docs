name: Read merged input diagnostic qualification

on:
  workflow_dispatch:
    inputs:
      read_merged_input:
        description: Read input-only diagnostic compatibility; grants no publication authority
        type: boolean
        default: false
      request_json:
        description: Independently reviewed exact raw producer request JSON
        type: string
        default: ''
      request_sha256:
        description: Independent SHA256 of the exact raw request bytes
        type: string
        default: ''
      binding_json:
        description: Independently reviewed completed-run immutable artifact binding JSON
        type: string
        default: ''
      binding_sha256:
        description: Independent SHA256 of the exact raw binding bytes
        type: string
        default: ''

permissions:
  contents: read

jobs:
  read-merged-input-diagnostic:
    if: github.event_name == 'workflow_dispatch' && inputs.read_merged_input == true && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      REVIEWED_SERVICES_READER_REVISION: '8b5f6519eda6f7993957ae81833d7ba93d725c02'
    steps:
      - name: Authenticate manual write access and stage independent public bindings
        env:
          METADATA_TOKEN: ${{ github.token }}
          DISPATCH_ACTOR: ${{ github.actor }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          REQUEST_JSON: ${{ inputs.request_json }}
          REQUEST_SHA256: ${{ inputs.request_sha256 }}
          BINDING_JSON: ${{ inputs.binding_json }}
          BINDING_SHA256: ${{ inputs.binding_sha256 }}
        run: |
          python3 -I -B - <<'PY'
          import hashlib, json, os, pathlib, re, urllib.parse, urllib.request
          def require(ok):
              if not ok: raise ValueError('Manual input diagnostic selection rejected')
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, *args, **kwargs): return None
          def pairs(rows):
              result = {}
              for key, value in rows:
                  require(key not in result); result[key] = value
              return result
          def reject(_): raise ValueError('Invalid JSON number')
          def document(name, maximum):
              raw = os.environ[name + '_JSON'].encode()
              require(0 < len(raw) <= maximum)
              digest = os.environ[name + '_SHA256']
              require(re.fullmatch('[0-9a-f]{64}', digest) and hashlib.sha256(raw).hexdigest() == digest)
              value = json.loads(raw, object_pairs_hook=pairs, parse_constant=reject)
              require(type(value) is dict)
              return raw, value
          try:
              require(os.environ['GITHUB_REPOSITORY'] == 'AIsa-team/docs' and
                      os.environ['GITHUB_EVENT_NAME'] == 'workflow_dispatch' and
                      os.environ['GITHUB_REF'] == 'refs/heads/main')
              reader = os.environ['REVIEWED_SERVICES_READER_REVISION']
              require(re.fullmatch('[0-9a-f]{40}', reader) and reader != '0' * 40)
              request_raw, request = document('REQUEST', 65536)
              binding_raw, binding = document('BINDING', 16384)
              require(len(request_raw) + len(binding_raw) <= 60000)
              require(request.get('main_revision') == os.environ['GITHUB_SHA'] and
                      binding.get('request_sha256') == os.environ['REQUEST_SHA256'] and
                      binding.get('reader_revision') == reader)
              opener = urllib.request.build_opener(urllib.request.ProxyHandler({}), NoRedirect())
              for actor in set((os.environ['DISPATCH_ACTOR'], os.environ['TRIGGERING_ACTOR'])):
                  require(re.fullmatch('[A-Za-z0-9][A-Za-z0-9-]{0,38}', actor))
                  url = 'https://api.github.com/repos/AIsa-team/docs/collaborators/' + urllib.parse.quote(actor, safe='') + '/permission'
                  query = urllib.request.Request(url, headers={'Authorization': 'Bearer ' + os.environ['METADATA_TOKEN'], 'Accept': 'application/vnd.github+json'})
                  with opener.open(query, timeout=15) as response:
                      raw = response.read(65537)
                      require(len(raw) <= 65536)
                  permission = json.loads(raw, object_pairs_hook=pairs, parse_constant=reject)
                  require(permission.get('permission') in ('write', 'maintain', 'admin'))
                  require(permission.get('user', {}).get('login', '').casefold() == actor.casefold())
              root = pathlib.Path(os.environ['RUNNER_TEMP']) / 'merged-input-reader-input'
              root.mkdir(mode=0o700)
              for name, raw in [('request.json', request_raw), ('binding.json', binding_raw)]:
                  with os.fdopen(os.open(root / name, os.O_WRONLY | os.O_CREAT | os.O_EXCL | os.O_NOFOLLOW, 0o600), 'wb') as stream:
                      stream.write(raw)
          except Exception:
              raise SystemExit('Manual input diagnostic selection rejected; details withheld') from None
          PY
      - name: Generate the existing scoped evidence read token
        id: evidence_read
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.AISA_CI_READ_APP_ID }}
          private-key: ${{ secrets.AISA_CI_READ_APP_PRIVATE_KEY }}
          owner: AIsa-team
          repositories: |
            AIsaServices
            docs
          permission-actions: read
          permission-contents: read
      - name: Checkout the exact current Docs anchor
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: docs-anchor
          fetch-depth: 0
          persist-credentials: false
      - name: Checkout the fixed reviewed Services reader
        uses: actions/checkout@v4
        with:
          repository: AIsa-team/AIsaServices
          ref: ${{ env.REVIEWED_SERVICES_READER_REVISION }}
          token: ${{ steps.evidence_read.outputs.token }}
          path: services-reader
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: services-reader/go.mod
          cache: true
          cache-dependency-path: services-reader/go.sum
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install the hash-pinned reader dependencies
        run: >-
          pip install --only-binary=:all: --require-hashes -r services-reader/scripts/worker-composer/requirements.txt
      - name: Consume the actual completed immutable producer evidence
        env:
          GH_TOKEN: ${{ steps.evidence_read.outputs.token }}
          REQUEST_SHA256: ${{ inputs.request_sha256 }}
          BINDING_SHA256: ${{ inputs.binding_sha256 }}
        run: |
          test "$(git -C docs-anchor rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git -C services-reader rev-parse HEAD)" = "$REVIEWED_SERVICES_READER_REVISION"
          test -z "$(git -C docs-anchor status --porcelain)"
          test -z "$(git -C services-reader status --porcelain)"
          python3 -B services-reader/scripts/worker-composer/read_merged_recovery_input.py \
            --request "$RUNNER_TEMP/merged-input-reader-input/request.json" --request-sha256 "$REQUEST_SHA256" \
            --binding "$RUNNER_TEMP/merged-input-reader-input/binding.json" --binding-sha256 "$BINDING_SHA256" \
            --docs-root "$GITHUB_WORKSPACE/docs-anchor" --output "$RUNNER_TEMP/merged-input-reader-result"
      - name: Retain only the input diagnostic consumer receipt
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: merged-input-consumer-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/merged-input-reader-result
          if-no-files-found: error
          retention-days: 2
