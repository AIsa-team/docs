name: Test runtime contracts

on:
  pull_request:
    paths:
      - '.github/workflows/**'
      - 'scripts/**'
      - 'openapi/**'
      - 'openapi.yaml'
      - 'docs.json'
      - 'api-reference/**'
      - 'zh/api-reference/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - 'scripts/**'
      - 'openapi/**'
      - 'openapi.yaml'
      - 'docs.json'
      - 'api-reference/**'
      - 'zh/api-reference/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: pip install 'PyYAML>=6,<7' 'jsonschema>=4.23,<5' 'openapi-spec-validator>=0.7,<0.8'
      - name: Test discovery, composition and preservation
        run: python -m unittest discover -s scripts/tests -v
