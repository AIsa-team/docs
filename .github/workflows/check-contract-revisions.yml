name: Check public contract revisions
on:
  # Dormant until BOTH the tracked plan and operator variable are enabled.
  schedule:
    - cron: '35 * * * *'
  workflow_dispatch:
    inputs:
      acceptance:
        description: Fail immediately on missing evidence or a revision mismatch
        type: boolean
        default: false
      expected_docs_ref:
        description: Independently selected full published docs SHA for acceptance
        type: string
      budget_start:
        description: Independently recorded UTC release budget start; never inferred or reset
        type: string

permissions:
  contents: read
  actions: read
jobs:
  activation-plan:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      enabled: ${{ steps.plan.outputs.enabled }}
    steps:
      - uses: actions/checkout@v4
      - id: plan
        run: |
          python scripts/contract_activation.py > /tmp/activation-plan.json
          echo "enabled=$(python -c 'import json; print(str(json.load(open("/tmp/activation-plan.json"))["activation_enabled"]).lower())')" >> "$GITHUB_OUTPUT"
  revisions:
    needs: activation-plan
    if: github.event_name == 'workflow_dispatch' || (needs.activation-plan.outputs.enabled == 'true' && vars.RUNTIME_CONTRACT_ACTIVATION_ENABLED == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install 'PyYAML>=6,<7'
      - uses: actions/cache/restore@v4
        with:
          path: .cache/contract-revisions
          key: contract-revisions-${{ github.run_id }}
          restore-keys: contract-revisions-
      - name: Check published contract evidence
        env:
          ACCEPTANCE: ${{ inputs.acceptance }}
          EXPECTED_DOCS_REF: ${{ inputs.expected_docs_ref }}
          BUDGET_START: ${{ inputs.budget_start }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          args=(--report /tmp/contract-revisions-report.json)
          if [ "$GITHUB_EVENT_NAME" = schedule ]; then
            python scripts/publication_origin.py select --output /tmp/publication-selection.json
            EXPECTED_DOCS_REF=$(python -c 'import json; print(json.load(open("/tmp/publication-selection.json"))["expected_docs_ref"])')
            BUDGET_START=$(python -c 'import json; print(json.load(open("/tmp/publication-selection.json"))["budget_start"])')
            args+=(--require-budget)
          fi
          if [ -n "$BUDGET_START" ]; then args+=(--budget-start "$BUDGET_START" --require-budget); fi
          if [ -n "$EXPECTED_DOCS_REF" ]; then
            hash=$(git show "$EXPECTED_DOCS_REF:openapi.yaml" | sha256sum | cut -d ' ' -f 1)
            python scripts/contract_activation.py --event "$GITHUB_EVENT_NAME" \
              --published-ref "$EXPECTED_DOCS_REF" --published-hash "$hash" > /tmp/source-selection.json
            args+=(--expected-docs-ref "$EXPECTED_DOCS_REF" --selection-file /tmp/source-selection.json --require-budget)
          fi
          if [ "$ACCEPTANCE" = 'true' ]; then
            args+=(--acceptance --require-budget)
          fi
          python scripts/check_contract_revisions.py "${args[@]}"
      - name: Retain dated convergence assessment
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-contract-convergence
          path: |
            /tmp/contract-revisions-report.json
            /tmp/publication-selection.json
          if-no-files-found: ignore
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: .cache/contract-revisions
          key: contract-revisions-${{ github.run_id }}
