    SearchFiltersRequest:
      type: object
      required:
      - filters
      properties:
        period:
          type: string
          enum:
          - annual
          - quarterly
          - ttm
          default: ttm
          description: The time period for the financial data.
        limit:
          type: integer
          minimum: 1
          maximum: 100
          default: 100
          description: The maximum number of results to return.
        order_by:
          type: string
          enum:
          - ticker
          - -ticker
          - report_period
          - -report_period
          default: ticker
          description: The field to order the results by.  Use -field to order in descending order.
        currency:
          type: string
          enum:
          - USD
          - EUR
          - GBP
          - JPY
          - CHF
          - AUD
          - CAD
          - SEK
          description: The currency of the financial data.
        historical:
          type: boolean
          default: false
          description: Whether to return historical financial data.
        filters:
          type: array
          items:
            type: object
            required:
            - field
            - operator
            - value
            properties:
              field:
                type: string
                description: The criteria to filter on.  For financial metric fields, use 'gt', 'lt', 'gte', 'lte', 'eq' operators.  For
                  'ticker' and 'cik' fields, use the 'in' operator to filter against multiple values.
              operator:
                type: string
                enum:
                - gt
                - lt
                - gte
                - lte
                - eq
                - in
                description: The comparison operator. The 'in' operator can only be used with a field value of 'ticker' or
                  'cik' and lets you filter against multiple values.
              value:
                oneOf:
                - type: number
                  description: The value to compare against for single-value operators (gt, lt, gte, lte, eq)
                - type: array
                  items:
                    type: string
                  description: Array of ticker or cik values to compare against when using the 'in' operator
          minItems: 1
          description: An array of filter objects to apply to the search.
