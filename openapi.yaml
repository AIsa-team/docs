    get:
      summary: Get Candlesticks
      description: Fetches historical candlestick data for a market identified by `condition_id`, over a specified interval.
      operationId: get_polymarket-candlesticks
      parameters:
      - name: condition_id
        in: query
        required: true
        description: Polymarket condition ID for the market.
        schema:
          type: string
        example: '0x1234abcd5678ef90'
      - name: start_time
        in: query
        required: true
        description: Unix timestamp (in seconds) for start of time range
        schema:
          type: integer
          example: 1640995200
      - name: end_time
        in: query
        required: true
        description: Unix timestamp (in seconds) for end of time range
        schema:
          type: integer
          example: 1672531200
      - name: interval
        in: query
        required: false
        description: "Interval length: 1 = 1m, 60 = 1h, 1440 = 1d. Defaults to 1m. \n\n⚠️ **Note:** There are range limits\
          \ for `interval` — specifically:\n- `1` (1m): max range **1 week**\n- `60` (1h): max range **1 month**\n- `1440`\
          \ (1d): max range **1 year**\n\n"
        schema:
          type: integer
          enum:
          - 1
          - 60
          - 1440
          default: 1
      responses:
        '200':
          description: Candlestick response
          content:
            application/json:
              schema:
                type: object
                properties:
                  candlesticks:
                    type: array
                    description: Array of market candlestick data, where each element is a tuple containing candlestick data
                      array and token metadata
                    items:
                      type: array
                      description: Tuple of [candlestick_data_array, token_metadata]
                      minItems: 2
                      maxItems: 2
