  /polymarket/wallet/pnl:
    parameters:
    - name: wallet_address
      in: path
      required: true
      schema:
        type: string
        pattern: ^0x[0-9a-fA-F]{40}$
        example: '0x1234567890abcdef1234567890abcdef12345678'
    get:
      summary: Get Wallet PnL
      description: Fetches the REALIZED profit and loss (PnL) for a specific wallet address over a specified time range and
        granularity. **Note:** This will differ to what you see on Polymarket's dashboard since Polymarket showcases historical
        unrealized PnL. This API tracks realized gains only - from either confirmed sells or redeems. We do not realize a
        gain/loss until a finished market is redeemed.
      operationId: get_polymarket-wallet-pnl
      parameters:
      - name: wallet_address
        in: query
        required: true
        description: Polymarket wallet address (0x-prefixed).
        schema:
          type: string
        example: '0x7c3db723f1d4d8cb9c550095203b686cb11e5c6b'
      - name: granularity
        in: query
        required: true
        schema:
          type: string
          enum:
          - day
          - week
          - month
          - year
          - all
          example: day
      - name: start_time
        in: query
        required: false
        description: Defaults to first day of first trade if not provided.
        schema:
          type: integer
          example: 1726857600
      - name: end_time
        in: query
        required: false
        description: Defaults to the current date if not provided.
        schema:
          type: integer
          example: 1758316829
      responses:
        '200':
          description: PnL response
          content:
            application/json:
              schema:
                type: object
                properties:
                  granularity:
                    type: string
                    example: day
                  start_time:
                    type: integer
                    example: 1726857600
                  end_time:
                    type: integer
                    example: 1758316829
                  wallet_address:
                    type: string
                    example: '0x7c3db723f1d4d8cb9c550095203b686cb11e5c6b'
