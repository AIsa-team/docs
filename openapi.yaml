                        minOrderSize:
                          type: string
                          example: '5'
                        negRisk:
                          type: boolean
                          example: true
                        assetId:
                          type: string
                          example: '56369772478534954338683665819559528414197495274302917800610633957542171787417'
                        timestamp:
                          type: integer
                          description: Timestamp of the snapshot in milliseconds
                          example: 1760471849407
                        tickSize:
                          type: string
                          example: '0.001'
