                - length
        citations:
          type: array
          description: List of source URLs referenced in the answer.
          items:
            type: string
        search_results:
          type: array
          description: Detailed search results with titles, snippets, and URLs.
          items:
            type: object
            properties:
              title:
                type: string
              url:
                type: string
              snippet:
                type: string
              date:
                type: string
              source:
                type: string
        usage:
