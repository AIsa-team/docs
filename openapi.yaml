  /chat/completions:
    post:
      summary: Generate images via Chat Completions (wan2.7 family)
      description: |-
        Generate images with the Wan 2.7 image models. Request shape matches OpenAI Chat Completions with multimodal content; the response contains `choices[].message.content[]` where each item is `{type: "image", image: "<url or base64>"}`.

        **Important:** `messages[].content` must be an **array of typed parts**, not a plain string. Passing a string returns `400 invalid_parameter_error` with `Input should be a valid list: messages[*].content`.

        By default `wan2.7-image` returns **4 candidate images** (billed per image). Set `n` to request a different count.
      operationId: generateImageViaChat
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - model
              - messages
              properties:
                model:
                  type: string
                  enum:
                  - wan2.7-image
                  - wan2.7-image-pro
                  description: Image-generation model. `wan2.7-image` ($0.030/image) for standard quality, `wan2.7-image-pro`
                    ($0.075/image) for higher fidelity.
                messages:
                  type: array
                  description: 'Conversation messages. Image prompts go in the last user message''s `content` array as `{type:
                    "text"}` parts.'
                  items:
                    type: object
                    required:
                    - role
                    - content
                    properties:
                      role:
                        type: string
                        enum:
                        - system
                        - user
                        - assistant
                      content:
                        type: array
                        description: 'Multimodal parts. For image generation, include at least one `{type: "text"}` part with
                          the prompt.'
                        items:
                          type: object
                          required:
                          - type
                          properties:
                            type:
                              type: string
                              enum:
                              - text
                              - image_url
                            text:
                              type: string
                              description: 'Used when `type: "text"`.'
                            image_url:
                              type: object
                              description: 'Used when `type: "image_url"` (image-to-image use cases).'
                              properties:
                                url:
                                  type: string
                                  format: uri
                n:
                  type: integer
                  minimum: 1
                  maximum: 4
                  default: 4
                  description: Number of images to generate. `wan2.7-image` returns 4 by default; pass `1` to save cost.
            examples:
              basic:
                summary: Single-image prompt (n=1)
                value:
                  model: wan2.7-image
                  messages:
                  - role: user
                    content:
                    - type: text
                      text: A cute red panda, ultra-detailed, cinematic lighting
                  n: 1
              four_variants:
                summary: Default 4 candidates for selection
                value:
                  model: wan2.7-image
                  messages:
                  - role: user
                    content:
                    - type: text
                      text: A futuristic cyberpunk city, neon lights, rainy night, 8k
              pro:
                summary: Higher-fidelity pro model
                value:
                  model: wan2.7-image-pro
                  messages:
                  - role: user
                    content:
                    - type: text
                      text: Oil painting of a rolling hillside at sunset, artstation
                  n: 1
              image_to_image:
                summary: Image-to-image (reference + prompt)
                value:
                  model: wan2.7-image-pro
                  messages:
                  - role: user
                    content:
                    - type: image_url
                      image_url:
                        url: https://example.com/reference.jpg
                    - type: text
                      text: Transform into an oil painting in the style of Van Gogh
                  n: 1
      responses:
        '200':
          description: Images generated. Returned as Chat Completion with `message.content[]` image parts.
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    example: chatcmpl-fcc86dfd-9424-9523-b0bd-cdf07383bee2
                  object:
                    type: string
                    example: chat.completion
                  created:
                    type: integer
                    example: 1776495713
                  model:
                    type: string
                    example: wan2.7-image
                  choices:
                    type: array
                    description: One entry per generated image.
                    items:
                      type: object
                      properties:
                        index:
                          type: integer
                          nullable: true
                        finish_reason:
                          type: string
                          example: stop
                        message:
                          type: object
                          properties:
                            role:
                              type: string
                              example: assistant
                            content:
                              type: array
                              items:
                                type: object
                                required:
                                - type
                                properties:
                                  type:
                                    type: string
                                    enum:
                                    - image
                                  image:
                                    type: string
                                    description: Short-lived URL to the generated image (or base64-encoded data, depending
                                      on your account configuration).
                  usage:
                    type: object
                    properties:
                      prompt_tokens:
                        type: integer
                      completion_tokens:
                        type: integer
                      total_tokens:
                        type: integer
              example:
                id: chatcmpl-fcc86dfd-9424-9523-b0bd-cdf07383bee2
                object: chat.completion
                created: 1776495713
                model: wan2.7-image
                choices:
                - index: 0
                  finish_reason: stop
                  message:
                    role: assistant
                    content:
                    - type: image
                      image: https://cdn.aisa.one/images/wan2.7/20260418-abc.png
                usage:
                  prompt_tokens: 104
                  completion_tokens: 8
                  total_tokens: 112
        '400':
          description: 'Invalid request. Most common: `content` passed as a string instead of an array → `"Input should be
            a valid list: messages[*].content"`.'
        '401':
          description: Missing or invalid AIsa API key.
        '429':
          description: Rate limit hit.
        '500':
          description: Internal error.
        '502':
          description: Upstream provider unreachable.
      tags:
      - Image Generation
      servers:
      - url: https://api.aisa.one/v1
  /messages:
    post:
      summary: Create a message
      description: Send a structured conversation to a Claude model and receive a response. Compatible with the Anthropic
        Messages API.
      operationId: createMessage
      security:
      - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - model
              - max_tokens
              - messages
              properties:
                model:
                  type: string
                  description: 'Claude model identifier. Examples: claude-opus-4-7, claude-sonnet-4-6, claude-haiku-4-5-20251001.'
                  example: claude-sonnet-4-6
                max_tokens:
                  type: integer
                  description: Maximum number of tokens to generate before stopping.
                  example: 1024
                messages:
                  type: array
                  description: Conversation turns.
                  items:
                    type: object
                    required:
                    - role
                    - content
                    properties:
                      role:
                        type: string
                        enum:
                        - user
                        - assistant
                      content:
                        description: String or array of content blocks.
                        oneOf:
                        - type: string
                        - type: array
                          items:
                            type: object
                  example:
                  - role: user
                    content: Hello, Claude
                system:
                  description: System prompt. String or array of text blocks.
                  oneOf:
                  - type: string
                  - type: array
                    items:
                      type: object
                temperature:
                  type: number
                  format: float
                  minimum: 0.0
                  maximum: 1.0
                  default: 1.0
                  description: Randomness. 0 = deterministic, 1 = creative.
                top_p:
                  type: number
                  format: float
                  description: Nucleus sampling. Use instead of temperature.
                top_k:
                  type: integer
                  description: Only sample from the top K options for each token.
                stop_sequences:
                  type: array
                  items:
                    type: string
                  description: Custom sequences that stop generation.
                stream:
                  type: boolean
                  default: false
                  description: Enable SSE streaming.
                tools:
                  type: array
                  description: Tools the model may use.
                  items:
                    type: object
                    required:
                    - name
                    - input_schema
                    properties:
                      name:
                        type: string
                      description:
                        type: string
                      input_schema:
                        type: object
                      type:
                        type: string
                        example: custom
                tool_choice:
                  type: object
                  description: How the model uses tools.
                  properties:
                    type:
                      type: string
                      enum:
                      - auto
                      - any
                      - tool
                      - none
                    name:
                      type: string
                      description: Required when type is tool.
                    disable_parallel_tool_use:
                      type: boolean
                      default: false
                thinking:
                  type: object
                  description: Enable extended thinking for complex reasoning.
                  properties:
                    type:
                      type: string
                      enum:
                      - enabled
                    budget_tokens:
                      type: integer
                      example: 10000
                    display:
                      type: string
                      enum:
                      - summarized
                      - omitted
                metadata:
                  type: object
                  properties:
                    user_id:
                      type: string
                      description: External user ID (no PII).
                service_tier:
                  type: string
                  enum:
                  - auto
                  - standard_only
                  default: auto
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    example: msg_024e7cf42f5d47cfa6982b5ff8b55642
                  type:
                    type: string
                    example: message
                  role:
                    type: string
                    example: assistant
                  content:
                    type: array
                    description: Response content blocks (text, tool_use, thinking, etc.).
                    items:
                      type: object
                  model:
                    type: string
                    example: claude-sonnet-4-6
                  stop_reason:
                    type: string
                    enum:
                    - end_turn
                    - stop_sequence
                    - max_tokens
                    - tool_use
                  stop_sequence:
                    type: string
                    nullable: true
                  usage:
                    type: object
                    properties:
                      input_tokens:
                        type: integer
                      output_tokens:
                        type: integer
                      cache_creation_input_tokens:
                        type: integer
                      cache_read_input_tokens:
                        type: integer
        '400':
          description: Invalid request parameters
        '401':
          description: Missing or invalid API key
        '429':
          description: Rate limit exceeded
        '500':
          description: Internal server error
      tags:
      - AI Models
      servers:
      - url: https://api.aisa.one/v1
