          example: '56369772478534954338683665819559528414197495274302917800610633957542171787417'
      - name: start_time
        in: query
        required: false
        description: Start time in Unix timestamp (milliseconds). Optional - if not provided along with end_time, returns
          the latest orderbook snapshot.
        schema:
          type: integer
          example: 1760470000000
      - name: end_time
        in: query
