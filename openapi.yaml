    ChatCompletionRequest:
      type: object
      required:
      - model
      - messages
      properties:
        model:
          type: string
          description: The Sonar model to use.
          enum:
          - sonar
          - sonar-pro
          - sonar-reasoning-pro
          - sonar-deep-research
        messages:
          type: array
          description: A list of messages comprising the conversation so far.
          items:
            type: object
            required:
            - role
            - content
            properties:
              role:
                type: string
                enum:
                - system
                - user
                - assistant
                description: The role of the message author.
              content:
                type: string
                description: The content of the message.
        max_tokens:
          type: integer
          description: The maximum number of tokens to generate in the response.
        temperature:
          type: number
          description: Sampling temperature between 0 and 2. Lower values make output more focused and deterministic.
          default: 0.2
          minimum: 0
          maximum: 2
        top_p:
          type: number
          description: Nucleus sampling parameter. The model considers tokens with top_p probability mass.
          default: 0.9
          minimum: 0
          maximum: 1
        top_k:
          type: integer
          description: The number of tokens to keep for top-k filtering.
          default: 0
          minimum: 0
          maximum: 2048
        stream:
          type: boolean
          description: Whether to stream the response using server-sent events.
          default: false
        search_context:
          type: string
          description: Controls how much search context to use. Affects per-request cost.
          enum:
          - low
          - medium
          - high
          default: low
        frequency_penalty:
          type: number
          description: Penalizes new tokens based on their existing frequency in the text so far. Positive values decrease
            the likelihood of repeating the same line verbatim.
          default: 1
          minimum: 0
          maximum: 2
        presence_penalty:
          type: number
          description: Penalizes new tokens based on whether they appear in the text so far. Positive values increase the
            likelihood of talking about new topics.
          default: 0
          minimum: -2
          maximum: 2
        return_citations:
          type: boolean
          description: Whether to return citations and search results in the response.
          default: true
        search_recency_filter:
          type: string
          description: Filter search results by recency.
          enum:
          - month
          - week
          - day
          - hour
        search_domain_filter:
          type: array
          description: Limit search to specific domains.
          items:
            type: string
    ChatCompletionResponse:
      type: object
      properties:
        id:
          type: string
          description: Unique identifier for the completion.
        model:
          type: string
          description: The model used for the completion.
        object:
          type: string
          example: chat.completion
        created:
          type: integer
          description: Unix timestamp of when the completion was created.
        choices:
          type: array
          items:
            type: object
            properties:
              index:
