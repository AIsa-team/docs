              with_poll:
                summary: Tweet with a poll
                value:
                  text: 'Pick your favorite:'
                  poll:
                    options:
                    - Option A
                    - Option B
                    - Option C
                    duration_minutes: 60
              with_media:
                summary: Tweet with media
                value:
                  text: Ship log 📸
                  media:
                    media_ids:
                    - '1146654567674912769'
                    tagged_user_ids:
                    - '2244994945'
              quote:
