      - period_type
      properties:
        ticker:
          type: string
          description: Stock ticker symbol.
          example: DAL
        metric_name:
          type: string
          description: Canonical metric name.
          example: load_factor
        value:
          type: number
          nullable: true
          description: Extracted numeric value.
          example: 82.0
        unit:
          type: string
          description: Unit of measure (e.g., %, cents, dollars, miles, count).
          example: '%'
        period:
          type: string
          description: Reporting period (e.g., Q4 2025, FY 2025, or a date like 2025-04-30 for non-standard fiscal years).
          example: Q4 2025
        period_type:
          type: string
          enum:
          - quarterly
          - annual
          description: Whether this is a quarterly or annual figure.
          example: quarterly
        segment:
          type: string
          nullable: true
          description: Business segment, geography, or sub-category. Only present when the metric is reported for a sub-unit
            rather than the consolidated entity.
          example: Commercial Engines & Services
        yoy_value:
          type: number
          nullable: true
          description: Year-over-year comparison value from the prior period.
          example: 84.0
        yoy_change_pct:
          type: number
          nullable: true
          description: Year-over-year percentage change.
          example: -2.381
        source_text:
          type: string
          nullable: true
          description: The source text span from the filing where this value was found.
          example: Passenger load factor
        source_url:
          type: string
          format: uri
          description: Direct link to the SEC filing. When available, includes a text fragment that highlights the source
            in the browser.
          example: https://www.sec.gov/Archives/edgar/data/27904/000002790426000008/deltaairlinesannouncesdece.htm
